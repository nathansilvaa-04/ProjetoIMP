<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Tarefas</h1>
      <p class="subtitle">Sistema de Gerenciamento de Tarefas</p>
    </header>

    <section class="form-section">
      <h2>Nova Tarefa</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="title">Título</label>
          <input type="text" id="title" required placeholder="Digite o título da tarefa">
        </div>
        <div class="form-group">
          <label for="description">Descrição</label>
          <textarea id="description" rows="3" placeholder="Digite a descrição (opcional)"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Criar Tarefa</button>
      </form>
    </section>

    <section class="tasks-section">
      <h2>Lista de Tarefas</h2>
      <div class="filters">
        <button class="btn btn-filter active" data-filter="todas">Todas</button>
        <button class="btn btn-filter" data-filter="pendente">Pendentes</button>
        <button class="btn btn-filter" data-filter="em_andamento">Em Andamento</button>
        <button class="btn btn-filter" data-filter="concluida">Concluídas</button>
      </div>
      <div id="tasksList" class="tasks-list">
        <p class="loading">Carregando tarefas...</p>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
